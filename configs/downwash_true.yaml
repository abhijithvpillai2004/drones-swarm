# TRUE aerodynamic downwash disturbance model (applied directly by simulator)
# Geometry: lower drone at relative position (dx, dy, dz) = pos_lower - pos_upper
# Downwash acts primarily downward (-z) when dz < 0 (lower drone is below upper drone).
model_type: "ellipsoidal"

# Ellipsoid semi-axes / influence radii (meters)
# In Hönig et al. (2018), downwash region is approximated as an elongated ellipsoid below the rotor
radius_xy: 0.25      # [m] Horizontal radius of influence # TODO: verify against Hönig 2018 / Neural-Swarm
radius_z: 0.80       # [m] Vertical wake reach below drone # TODO: verify against Hönig 2018 / Neural-Swarm

# Disturbance force parameters
max_force_z: 0.15    # [N] Peak downward force at core of wake (approx 50-60% of CF2X hover thrust ~0.27N) # TODO: verify against Hönig 2018 / Neural-Swarm
radial_falloff: "gaussian"  # Options: gaussian, quadratic, linear # TODO: verify against Hönig 2018 / Neural-Swarm
vertical_falloff: "exponential" # Options: exponential, linear # TODO: verify against Hönig 2018 / Neural-Swarm

# Wake tilt / drift under upper drone horizontal velocity
wake_skew_coefficient: 0.1  # [s] Horizontal shift proportional to upper drone velocity # TODO: verify against Hönig 2018 / Neural-Swarm

# Multi-source overlapping wake combination parameters
combination_mode: "linear_sum"  # Options: linear_sum, max, sublinear, saturated
max_combined_force_z: 0.45      # [N] Ceiling on cumulative multi-rotor downward disturbance
sublinear_gamma: 0.8            # Exponent for sublinear superposition mode
